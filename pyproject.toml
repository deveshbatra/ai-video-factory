[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "spark-video-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.11.9", "PyYAML==6.0.2", "Pillow==11.3.0", "imageio-ffmpeg==0.6.0"]
[project.scripts]
svf = "svf.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
