schema_version: 1
episode_id: ganeshas-world
title: Ganesha’s World
authorship: Original Codex-authored screenplay based on a traditional story; not generated
  by Qwen or transcribed from the named anthology.
source:
  url: https://www.venkateswaratemple.org/Festivals/GaneshChaturthi.pdf
  edition_status: User accepted this story choice; exact anthology edition not supplied.
  adaptation_notes:
  - Follows the three-circuit fruit-prize variant.
  - Golden mango, dialogue-free performance, staging and final award ellipsis are
    editorial choices.
  - Two-arm Ganesha and single-faced Kartikeya are selected storybook designs, not
    claims that other iconography is incorrect.
duration_seconds: 45
language: en
style: Respectful Indian mythological storybook animation, sculpted rounded forms,
  expressive restrained faces, hand-painted textile details, warm sunrise rim light,
  saffron, teal and sandstone palette, cinematic depth, no photorealism.
characters:
  ganesha: Ganesha, elephant-headed youthful deity, warm peach skin, broad elephant
    ears, one trunk curling toward his own left, rounded belly, exactly two arms in
    this selected child-story depiction, saffron dhoti with red waistband, small plain
    gold crown, gold wrist cuffs, barefoot. No carried weapons. Keep the same tusk
    silhouette in every shot.
  kartikeya: Kartikeya, youthful deity with one human face and exactly two arms in
    this selected depiction, warm brown skin, black hair, slender athletic build,
    teal dhoti, short red shoulder sash, small gold crown, barefoot; calm courageous
    expression. Rides one blue-green peacock; no weapons in this adaptation.
  shiva: Shiva, serene adult deity, ash-blue skin, black hair in a high topknot with
    a small crescent moon, three horizontal white forehead lines, rudraksha necklace,
    simple ochre lower garment, exactly two visible arms, seated cross-legged. Keep
    a dignified calm expression.
  parvati: Parvati, serene adult goddess, warm brown skin, long black hair partly
    covered by a red sari with a gold border, green blouse, small red bindi, modest
    gold jewelry, exactly two arms, seated beside Shiva. Warm attentive expression.
world:
  id: kailash-terrace
  description: Open sandstone terrace on Mount Kailash, snowy peaks distant, sunrise
    from upper left, two seated parents on a low central oval dais, one low mango
    pedestal front-right. No modern buildings, text or crowd.
  positions: Shiva screen left of Parvati in frontal shots. Never swap their seats.
    Departing Kartikeya moves left-to-right. The camera does not mirror any shot.
delivery:
  width: 576
  height: 1024
  fps: 16
  shot_source_frames: 81
  shot_delivered_frames: 80
  trim: 'Keep source frames 0–79. Drop only final frame 80: each source 5.0625s becomes
    5.000s. No interpolation, retiming or automatic crop.'
  captions: Editorial overlay only; 2 lines maximum, x=8–82%, y=72–82%; avoid bottom/right
    platform UI. Reposition only with recorded edit if faces overlap.
control:
  route: 'Clockwise as seen from overhead: front(bottom) -> image left -> behind(top)
    -> image right -> front. Parents stay on walker’s right.'
  orbit_normalized_points:
  - - 0.5
    - 0.76
  - - 0.24
    - 0.51
  - - 0.5
    - 0.29
  - - 0.76
    - 0.51
  - - 0.5
    - 0.76
  orbit_note: Points are screen-space blocking guides; rear pass must be occluded
    behind seated parents. This is not executable path conditioning in the current
    Wan adapter.
  priority:
  - Character and iconographic consistency
  - Exactly three readable circuits
  - Clear cause and payoff
  - Natural motion
  - Additional detail
  generation_rules:
  - One primary action per shot; no whole-story prompt.
  - Lock approved keyframes before I2V. A shared seed is not an identity lock.
  - T2V renders are motion auditions, not reference-conditioned finals.
  - Do not use negative extra limbs to erase deliberately selected iconography.
  - Never silently replace missing actions with still-image pans.
audio:
  voice: Warm measured English narration, original recording preferred; no imitation
    of a known actor. No TTS model is installed/approved for this episode.
  performance: Offscreen narrator, around 115–140 words/minute inside each cue; record
    each cue separately and preserve pauses. No lip sync.
  music: Original or explicitly licensed gentle plucked strings and soft drone; no
    borrowed film score or claimed sacred chant.
  cues:
  - time: 0.2
    cue: one soft bell
  - time: 6
    cue: two soft wing sweeps
  - time: 15
    cue: quiet footsteps under three circuits
  - time: 30
    cue: music thins for meaning
  - time: 42
    cue: gentle harmonic resolution
  mix: Target -16 LUFS integrated and <= -1 dBTP, measure after final mix; duck music
    beneath narration. Values are targets, not measurements.
budgets:
  paid_generation_gbp: 0
  max_candidates_per_shot: 2
  gpu_concurrency: 1
  automatic_publishing: false
production_status:
  reference_images: pending local SDXL audition
  i2v: 'blocked: no supported reference-conditioned adapter/checkpoint yet'
  voice: pending original recording
  final_video: not_generated
